<!DOCTYPE html>
<html lang="ko" class="library-mode">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Book Reader</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700;900&display=swap');
*{box-sizing:border-box}
html{min-height:100%;scroll-behavior:smooth}
html.library-mode{overflow-y:auto;scroll-snap-type:none}
html.reader-mode{height:100%;overflow-y:scroll;scroll-snap-type:y mandatory}
body{margin:0;min-height:100%;font-family:'Nunito',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#10201d;color:#fff}
button{font:inherit;color:inherit}
.library{min-height:100vh;background:linear-gradient(140deg,#f9ca24 0%,#f0932b 38%,#00cec9 100%);padding:clamp(18px,4vw,44px);display:flex;align-items:center;justify-content:center}
.library-shell{width:min(1180px,100%);display:grid;gap:24px}
.library-head{display:flex;align-items:end;justify-content:space-between;gap:18px}
.brand-kicker{margin:0 0 6px;font-size:.86rem;font-weight:900;color:rgba(255,255,255,.82)}
.library h1{margin:0;font-family:'Fredoka One',cursive;font-size:clamp(2.4rem,6vw,5.6rem);line-height:.96;text-shadow:3px 5px 0 rgba(0,0,0,.18);letter-spacing:0}
.library-sub{max-width:470px;margin:0;color:rgba(255,255,255,.9);font-size:clamp(.98rem,2vw,1.18rem);font-weight:900;line-height:1.5;text-align:right}
.book-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}
.book-card{border:0;border-radius:22px;background:rgba(255,255,255,.24);box-shadow:0 18px 46px rgba(0,0,0,.22),inset 0 0 0 1px rgba(255,255,255,.28);padding:12px;display:grid;gap:12px;text-align:left;cursor:pointer;min-height:0;backdrop-filter:blur(10px);transition:transform .16s ease,box-shadow .16s ease,background .16s ease}
.book-card:hover,.book-card:focus-visible{transform:translateY(-4px);background:rgba(255,255,255,.32);box-shadow:0 24px 60px rgba(0,0,0,.28),inset 0 0 0 1px rgba(255,255,255,.36);outline:none}
.book-cover{width:100%;aspect-ratio:4/3;border-radius:16px;overflow:hidden;background:rgba(255,255,255,.28);box-shadow:0 8px 24px rgba(0,0,0,.18)}
.book-cover img{width:100%;height:100%;object-fit:cover;display:block}
.book-card h2{margin:0;font-size:clamp(1rem,1.8vw,1.18rem);line-height:1.18;color:#fff;letter-spacing:0}
.book-card p{margin:0;color:rgba(255,255,255,.86);font-size:.88rem;font-weight:900}
.reader{display:none}
.reader.active{display:block}
.reader-page{scroll-snap-align:start;min-height:100vh;height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:clamp(16px,4vw,32px);gap:14px;text-align:center;position:relative;overflow:hidden}
.reader-page.cover{background:linear-gradient(135deg,#f9ca24,#f0932b)}
.card-inner{width:min(1280px,100%);height:100%;max-height:calc(100svh - 40px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(8px,1.5svh,14px);min-height:0}
.reader-page.card .card-inner{justify-content:flex-start;padding-top:clamp(8px,1.4svh,16px)}
.num{position:absolute;top:12px;left:12px;z-index:2;font-family:'Fredoka One',cursive;font-size:.9rem;background:rgba(255,255,255,.42);color:#fff;border-radius:50px;padding:4px 13px;box-shadow:0 6px 20px rgba(0,0,0,.12);backdrop-filter:blur(8px)}
.book-shot{position:relative;width:min(96vw,1240px);height:min(74svh,760px);border-radius:22px;padding:8px;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;box-shadow:0 18px 48px rgba(0,0,0,.28),inset 0 0 0 1px rgba(255,255,255,.25);backdrop-filter:blur(4px);overflow:hidden}
.single .book-shot{width:min(96vw,1240px)}
.cover .book-shot{width:min(78vw,760px);height:min(48svh,520px);padding:10px}
.page-img{width:100%;height:100%;object-fit:contain;display:block;border-radius:14px;image-orientation:none;box-shadow:0 8px 26px rgba(0,0,0,.24);background:rgba(255,255,255,.18);transform:scale(1.08)}
.cover .page-img{width:100%;height:100%;object-fit:cover;transform:none}
.cover h1{font-family:'Fredoka One',cursive;font-size:clamp(2.25rem,7vw,5rem);line-height:1.04;color:#fff;text-shadow:3px 4px 0 rgba(0,0,0,.2);letter-spacing:0;margin:0}
.cover-sub{max-width:720px;font-size:clamp(.98rem,2.6vw,1.28rem);line-height:1.55;color:rgba(255,255,255,.92);font-weight:900;text-shadow:0 2px 12px rgba(0,0,0,.18);margin:0}
.read-panel{position:absolute;left:50%;bottom:clamp(10px,2svh,18px);transform:translateX(-50%);z-index:20;width:min(760px,calc(100vw - 168px));max-height:min(20svh,150px);display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:12px;background:rgba(0,0,0,.18);border-radius:22px;padding:10px 14px;box-shadow:0 12px 34px rgba(0,0,0,.22),inset 0 0 0 1px rgba(255,255,255,.14);backdrop-filter:blur(10px)}
.page-text{max-width:none;max-height:min(15svh,116px);overflow:auto;font-size:clamp(.95rem,2.2vw,1.14rem);font-weight:900;color:rgba(255,255,255,.95);background:transparent;border-radius:0;padding:0 6px;line-height:1.45;text-align:center;box-shadow:none}
.page-text p+p{margin-top:.8em}
.page-text:empty{display:none}
.audio-btns{display:flex;justify-content:center;margin-top:2px}
.read-panel .audio-btns{margin:0}
.btn-play{font-family:'Fredoka One',cursive;font-size:clamp(1rem,2.8vw,1.25rem);border:none;border-radius:50px;background:rgba(255,255,255,.92);color:#2d3436;padding:12px 34px;cursor:pointer;display:flex;align-items:center;gap:10px;box-shadow:0 4px 18px rgba(0,0,0,.25);transition:transform .15s,box-shadow .15s,background .15s;white-space:nowrap}
.btn-play:hover{transform:scale(1.09);box-shadow:0 6px 24px rgba(0,0,0,.32)}
.btn-play:active{transform:scale(.96)}
.btn-play .icon{font-size:1.3em;transition:transform .2s}
.btn-play.playing{background:rgba(255,255,255,1);animation:playPulse .7s ease-in-out infinite alternate}
.btn-play.playing .icon{animation:iconBounce .5s ease-in-out infinite alternate}
@keyframes playPulse{from{box-shadow:0 4px 18px rgba(0,0,0,.25)}to{box-shadow:0 0 28px rgba(255,255,255,.7),0 4px 18px rgba(0,0,0,.2)}}
@keyframes iconBounce{from{transform:scale(1)}to{transform:scale(1.4)}}
.c0{background:linear-gradient(150deg,#6c5ce7,#a29bfe)}.c1{background:linear-gradient(150deg,#00b894,#55efc4)}.c2{background:linear-gradient(150deg,#e84393,#fd79a8)}.c3{background:linear-gradient(150deg,#e17055,#fab1a0)}.c4{background:linear-gradient(150deg,#0984e3,#74b9ff)}.c5{background:linear-gradient(150deg,#f9ca24,#f0932b)}.c6{background:linear-gradient(150deg,#00cec9,#81ecec)}.c7{background:linear-gradient(150deg,#6c5ce7,#fd79a8)}
#nav{position:fixed;right:12px;top:50%;transform:translateY(-50%);display:none;flex-direction:column;gap:5px;z-index:999}
.reader.active #nav{display:flex}
.dot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.3);cursor:pointer;transition:.3s}
.dot.on{background:#fff;transform:scale(1.6)}
.auto-toggle,.back-btn{position:fixed;z-index:1000;border:none;border-radius:50px;background:rgba(255,255,255,.94);color:#2d3436;min-height:44px;display:none;align-items:center;gap:8px;font-family:'Nunito',sans-serif;font-size:.95rem;font-weight:900;box-shadow:0 6px 24px rgba(0,0,0,.28);cursor:pointer;transition:transform .15s,background .15s,color .15s,box-shadow .15s;backdrop-filter:blur(8px)}
.reader.active .auto-toggle,.reader.active .back-btn{display:flex}
.auto-toggle{right:18px;bottom:18px;padding:10px 16px}
.back-btn{left:18px;top:18px;padding:10px 16px}
.auto-toggle:hover,.back-btn:hover{transform:scale(1.05);box-shadow:0 8px 28px rgba(0,0,0,.34)}
.auto-toggle:active,.back-btn:active{transform:scale(.96)}
.auto-toggle .auto-state{font-family:'Fredoka One',cursive;color:#00b894}
.auto-toggle.off{background:rgba(45,52,54,.9);color:#fff}
.auto-toggle.off .auto-state{color:#ff7675}
@media (max-width:900px){.book-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.library-head{display:grid}.library-sub{text-align:left}}
@media (max-width:720px){.library{padding:18px 14px}.book-grid{grid-template-columns:1fr}.reader-page{padding:14px 6px 76px}.card-inner{max-height:calc(100svh - 92px)}.book-shot{width:98vw;height:min(52svh,73.5vw);border-radius:18px;padding:6px}.single .book-shot{width:98vw}.cover .book-shot{width:86vw;height:min(44svh,390px)}.page-img{border-radius:11px;transform:scale(1.04)}.cover .page-img{transform:none}.num{top:8px;left:8px;font-size:.8rem;padding:3px 11px}.read-panel{width:min(96vw,540px);grid-template-columns:1fr;gap:8px;padding:9px 12px;bottom:62px}.read-panel .audio-btns{order:2}.page-text{max-height:min(14svh,120px);padding:0 6px;line-height:1.42}.page-text p+p{margin-top:.35em}.auto-toggle{right:12px;bottom:12px;padding:9px 12px;font-size:.85rem}.back-btn{left:12px;top:12px;padding:9px 12px;font-size:.85rem}}
@media (orientation:landscape) and (min-width:721px){.reader-page{padding:10px 44px 18px 16px}.card-inner{max-height:calc(100svh - 16px);gap:clamp(6px,1.1svh,10px)}.book-shot{width:min(96vw,1320px);height:min(82svh,840px);padding:8px}.audio-btns{margin-top:0}.btn-play{padding:10px 30px}.read-panel{width:min(720px,calc(100vw - 320px));bottom:clamp(8px,1.4svh,14px)}.page-text{max-height:min(13svh,112px);line-height:1.42;padding:0 8px}}
@media (orientation:landscape) and (max-height:620px){.reader-page{padding:8px 46px 8px 12px}.card-inner{display:flex;max-height:calc(100svh - 10px);padding-top:0}.book-shot{width:min(86vw,920px);height:min(74svh,520px)}.read-panel{width:min(620px,calc(100vw - 280px));bottom:8px;padding:8px 10px}.page-text{max-height:min(16svh,96px)}.cover .card-inner{display:flex}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="library" class="library"></div>
<div id="reader" class="reader">
  <button id="backBtn" class="back-btn" type="button">← 책 목록</button>
  <div id="nav"></div>
  <button id="autoNextToggle" class="auto-toggle" type="button" aria-pressed="true"><span>자동 넘김</span><span class="auto-state">ON</span></button>
  <div id="slides"></div>
</div>
<script>
const ASSET_BASE = "https://storage.googleapis.com/share.tpcground.com/book-reader-rotated-20260509-163139-742776/";
const BOOKS = [
  {
    "slug": "book11",
    "title": "Cave Boy",
    "pages": [
      {
        "img": "IMG_1767.JPG",
        "audio": "audio/00_page00.mp3",
        "cover": true,
        "title": "Cave Boy",
        "sub": "Cathy East Dubowski and Mark Lubowski",
        "text": ""
      },
      {
        "img": "IMG_1768.JPG",
        "audio": "audio/01_page01.mp3",
        "pg": "p. 1",
        "single": true,
        "text": "Hi.\nMy name is Harry.\nI live with my family\nin this cave."
      },
      {
        "img": "IMG_1769.JPG",
        "audio": "audio/02_page02.mp3",
        "pg": "p. 2",
        "single": true,
        "text": "My friends like to\nrun and jump\nand swing and climb.\nI like those things too."
      },
      {
        "img": "IMG_1770.JPG",
        "audio": "audio/03_page03.mp3",
        "pg": "p. 3",
        "single": true,
        "text": "But most of all\nI like to make new things.\nThings no one has\never seen before."
      },
      {
        "img": "IMG_1771.JPG",
        "audio": "audio/04_page04.mp3",
        "pg": "p. 4",
        "single": true,
        "text": "I put a rock on a stick.\nWhat does it do?\nBam! Bam!\nI call it a hammer.\nI cut up a log.\nWhat does it do?\nBoom! Boom!\nI call it a boomer."
      },
      {
        "img": "IMG_1772.JPG",
        "audio": "audio/05_page05.mp3",
        "pg": "p. 5",
        "single": true,
        "text": "\"Stop all that bamming! Stop all that booming.\"\n\n\"That’s Chief Grump! He’s always mad about something.\""
      },
      {
        "img": "IMG_1773.JPG",
        "audio": "audio/06_page06.mp3",
        "pg": "p. 14",
        "single": true,
        "text": "Tomorrow is his birthday,\nMaybe I can cheer him up.\n\nI will make something new,\njust for Chief Grump."
      },
      {
        "img": "IMG_1774.JPG",
        "audio": "audio/07_page07.mp3",
        "pg": "p. 7",
        "single": true,
        "text": "Wow! I have never seen anything like it!\nMy friends say, \"What is that thing?\"\nI say, \"Don't look! It's a surprise!\""
      },
      {
        "img": "IMG_1775.JPG",
        "audio": "audio/08_page08.mp3",
        "pg": "p. 8",
        "single": true,
        "text": "It is time for Chief Grump's party.\nHe gets lots of presents.\nA rock, some wood, a fish, a bone."
      },
      {
        "img": "IMG_1776.JPG",
        "audio": "audio/09_page09.mp3",
        "pg": "p. 21",
        "single": true,
        "text": "Chief Grump says, \"I do not need this!\"\n\"I do not want that!\"\nHe throws them down the hill.\nNow Chief Grump opens my present.\n\"What does it do?\""
      },
      {
        "img": "IMG_1777.JPG",
        "audio": "audio/10_page10.mp3",
        "pg": "p. 10",
        "single": true,
        "text": "Everyone looks\nat my new thing.\n\"Does it bam or boom?\"\n\"Does it bounce?\"\n\"Does it bite?\"\nBut no one can guess\nwhat it does.\nNot even me."
      },
      {
        "img": "IMG_1778.JPG",
        "audio": "audio/11_page11.mp3",
        "pg": "p. 11",
        "single": true,
        "text": "Chief Grump says,\n\"It does not do\nanything!\"\n\nHe kicks it\ndown the hill"
      },
      {
        "img": "IMG_1779.JPG",
        "audio": "audio/12_page12.mp3",
        "pg": "p. 12",
        "single": true,
        "text": "Hey!\nNow I know what this new thing does.\nIt rolls!"
      },
      {
        "img": "IMG_1780.JPG",
        "audio": "audio/13_page13.mp3",
        "pg": "p. 28",
        "single": true,
        "text": "I take it back to my room.\nI put something here.\nI add something there.\nMaybe Chief Grump will like it now."
      },
      {
        "img": "IMG_1781.JPG",
        "audio": "audio/14_page14.mp3",
        "pg": "p. 30",
        "single": true,
        "text": "I tell him,\n\"Sit here.\nPut your feet there.\"\nI give him a push.\n\nLook! I made something\nreally new.\nSomething no one\nhas ever seen before."
      },
      {
        "img": "IMG_1782.JPG",
        "audio": "audio/15_page15.mp3",
        "pg": "p. 15",
        "single": true,
        "text": "I made Chief Grump smile!"
      }
    ],
    "subtitle": "Cathy East Dubowski and Mark Lubowski"
  },
  {
    "slug": "book12",
    "title": "What Is a Fish?",
    "pages": [
      {
        "img": "IMG_1789.JPG",
        "audio": "audio/00_page00.mp3",
        "cover": true,
        "title": "What Is a Fish?",
        "sub": "",
        "text": ""
      },
      {
        "img": "IMG_1790.JPG",
        "audio": "audio/01_page01.mp3",
        "pg": "p. 1",
        "single": true,
        "text": "What Is a Fish?"
      },
      {
        "img": "IMG_1791.JPG",
        "audio": "audio/02_page02.mp3",
        "pg": "p. 5",
        "single": true,
        "text": "Fish are part of the animal kingdom. Some fish live in fresh water. Some fish live in salt water."
      },
      {
        "img": "IMG_1792.JPG",
        "audio": "audio/03_page03.mp3",
        "pg": "p. 7",
        "single": true,
        "text": "Fish are cold-blooded. Their body temperature is the same as the water around them."
      },
      {
        "img": "IMG_1793.JPG",
        "audio": "audio/04_page04.mp3",
        "pg": "p. 8",
        "single": true,
        "text": "Most fish lay eggs. Young fish hatch from eggs."
      },
      {
        "img": "IMG_1794.JPG",
        "audio": "audio/05_page05.mp3",
        "pg": "p. 10",
        "single": true,
        "text": "Fish have a skeleton."
      },
      {
        "img": "IMG_1795.JPG",
        "audio": "audio/06_page06.mp3",
        "pg": "p. 12",
        "single": true,
        "text": "Fish have scales."
      },
      {
        "img": "IMG_1796.JPG",
        "audio": "audio/07_page07.mp3",
        "pg": "p. 14",
        "single": true,
        "text": "Fish breathe through gills."
      },
      {
        "img": "IMG_1797.JPG",
        "audio": "audio/08_page08.mp3",
        "pg": "p. 17",
        "single": true,
        "text": "Fish have fins to help them swim."
      },
      {
        "img": "IMG_1798.JPG",
        "audio": "audio/09_page09.mp3",
        "pg": "p. 19",
        "single": true,
        "text": "Fish move their tail back\nand forth to swim."
      },
      {
        "img": "IMG_1799.JPG",
        "audio": "audio/10_page10.mp3",
        "pg": "p. 20",
        "single": true,
        "text": "Some fish swim together\nin groups called schools."
      },
      {
        "img": "IMG_1800.JPG",
        "audio": "audio/11_page11.mp3",
        "pg": "p. 22",
        "single": true,
        "text": "Words to Know\n\nwater - a clear liquid that has no color or taste.\n\nwaterproof - something that does not let water through.\n\nwater cycle - the way water moves from the ground to the sky and back again."
      }
    ],
    "subtitle": ""
  },
  {
    "slug": "book13",
    "title": "The Berenstain Bears Ride the Thunderbolt",
    "pages": [
      {
        "img": "IMG_1801.JPG",
        "audio": "audio/00_page00.mp3",
        "cover": true,
        "title": "The Berenstain Bears Ride the Thunderbolt",
        "sub": "Jan Berenstain",
        "text": ""
      },
      {
        "img": "IMG_1802.JPG",
        "audio": "audio/01_page01.mp3",
        "pg": "p. 1",
        "single": true,
        "text": "The Thunderbolt!"
      },
      {
        "img": "IMG_1803.JPG",
        "audio": "audio/02_page02.mp3",
        "pg": "p. 2",
        "single": true,
        "text": "Waiting in line.\nBuying tickets."
      },
      {
        "img": "IMG_1804.JPG",
        "audio": "audio/03_page03.mp3",
        "pg": "p. 3",
        "single": true,
        "text": "Getting on.\nBuckling up."
      },
      {
        "img": "IMG_1805.JPG",
        "audio": "audio/04_page04.mp3",
        "pg": "p. 4",
        "single": true,
        "text": "Going up,\nUp, up!\nClickety-clickety\nclackety-click!"
      },
      {
        "img": "IMG_1806.JPG",
        "audio": "audio/05_page05.mp3",
        "pg": "p. 5",
        "single": true,
        "text": "At the top."
      },
      {
        "img": "IMG_1807.JPG",
        "audio": "audio/06_page06.mp3",
        "pg": "p. 6",
        "single": true,
        "text": "Going down.\nDown, down, down!\nClackety-clackety\nclitter-clack!"
      },
      {
        "img": "IMG_1808.JPG",
        "audio": "audio/07_page07.mp3",
        "pg": "p. 7",
        "single": true,
        "text": "Down and around!\nUpside down!"
      },
      {
        "img": "IMG_1809.JPG",
        "audio": "audio/08_page08.mp3",
        "pg": "p. 8",
        "single": true,
        "text": "Into the dark!"
      },
      {
        "img": "IMG_1810.JPG",
        "audio": "audio/09_page09.mp3",
        "pg": "p. 9",
        "single": true,
        "text": "Look out! Spooks!"
      },
      {
        "img": "IMG_1811.JPG",
        "audio": "audio/10_page10.mp3",
        "pg": "p. 10",
        "single": true,
        "text": "Into the light.\nSlowing down."
      },
      {
        "img": "IMG_1812.JPG",
        "audio": "audio/11_page11.mp3",
        "pg": "p. 11",
        "single": true,
        "text": "Getting off."
      },
      {
        "img": "IMG_1813.JPG",
        "audio": "audio/12_page12.mp3",
        "pg": "p. 12",
        "single": true,
        "text": "'Again! Again! Do it again!'"
      },
      {
        "img": "IMG_1814.JPG",
        "audio": "audio/13_page13.mp3",
        "pg": "p. 13",
        "single": true,
        "text": "\"Not so quick! Not so quick! Your papa looks a little sick.\""
      },
      {
        "img": "IMG_1815.JPG",
        "audio": "audio/14_page14.mp3",
        "pg": "p. 14",
        "single": true,
        "text": "\"But that was fun! That was fun.\""
      },
      {
        "img": "IMG_1816.JPG",
        "audio": "audio/15_page15.mp3",
        "pg": "p. 15",
        "single": true,
        "text": "Going on again, minus one."
      }
    ],
    "subtitle": "Jan Berenstain"
  },
